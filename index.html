<style>
/* ============================================================
   HOME NEEDS IQ — نظام التصميم (Design System)
   Mobile-first · RTL · خصائص منطقية · لون واحد أساس مشتق بالـOKLCH
   ============================================================ */
:root{
  /* ---- اللون الأساس (السمائي من اللوكو) ومشتقاته ---- */
  --sky: oklch(0.66 0.135 236);
  --sky-strong: color-mix(in oklch, var(--sky), black 15%);
  --sky-deep:   color-mix(in oklch, var(--sky), black 30%);
  --sky-soft:   color-mix(in oklch, var(--sky), white 85%);
  --sky-tint:   color-mix(in oklch, var(--sky), white 92%);
  --sky-wash:   color-mix(in oklch, var(--sky), white 96%);
  --sky-border: color-mix(in oklch, var(--sky), white 58%);

  --deep:        oklch(0.40 0.075 240);
  --deep-strong: oklch(0.30 0.06 240);

  --sun:        oklch(0.845 0.155 92);
  --sun-strong: color-mix(in oklch, var(--sun), black 16%);
  --sun-soft:   color-mix(in oklch, var(--sun), white 80%);
  --sun-ink:    oklch(0.42 0.07 80);

  /* محايدات مصبوغة بلمسة سمائية */
  --paper:    color-mix(in oklch, var(--sky) 3%, white);
  --surface:  #ffffff;
  --surface-2:color-mix(in oklch, var(--sky) 5%, white);
  --border:   color-mix(in oklch, var(--sky) 14%, white);
  --border-2: color-mix(in oklch, var(--sky) 26%, white);
  --ink:      oklch(0.28 0.028 240);
  --ink-soft: oklch(0.44 0.028 240);
  --muted:    oklch(0.58 0.02 240);

  --ok:        oklch(0.58 0.13 155);
  --ok-soft:   color-mix(in oklch, var(--ok), white 86%);
  --ok-border: color-mix(in oklch, var(--ok), white 58%);
  --off:       oklch(0.60 0.015 30);
  --off-soft:  color-mix(in oklch, var(--off), white 88%);
  --danger:    oklch(0.57 0.17 27);
  --danger-soft: color-mix(in oklch, var(--danger), white 86%);

  /* ---- طباعة ---- */
  --f-display:"Changa","Readex Pro",system-ui,sans-serif;
  --f-body:"Readex Pro",system-ui,sans-serif;
  --t-2xs:.70rem; --t-xs:.775rem; --t-sm:.86rem; --t-base:.98rem;
  --t-lg:1.12rem; --t-xl:1.32rem; --t-2xl:1.6rem; --t-3xl:2rem;
  --t-hero: clamp(1.7rem, 1.15rem + 2.6vw, 2.7rem);

  /* ---- مسافات ---- */
  --s1:.25rem;--s2:.5rem;--s3:.75rem;--s4:1rem;--s5:1.25rem;--s6:1.5rem;
  --s7:1.75rem;--s8:2rem;--s10:2.5rem;--s12:3rem;--s14:3.5rem;--s16:4rem;

  /* ---- أشكال ---- */
  --r-xs:8px; --r-sm:11px; --r:14px; --r-lg:20px; --r-xl:26px; --r-pill:999px;

  /* ---- ظلال مصبوغة (ليست رمادية) ---- */
  --sh-sm: 0 1px 2px color-mix(in oklch,var(--deep) 14%,transparent),
           0 4px 10px -6px color-mix(in oklch,var(--deep) 22%,transparent);
  --sh:    0 1px 2px color-mix(in oklch,var(--deep) 15%,transparent),
           0 12px 26px -18px color-mix(in oklch,var(--deep) 34%,transparent);
  --sh-lift: 0 2px 8px color-mix(in oklch,var(--deep) 18%,transparent),
           0 22px 44px -20px color-mix(in oklch,var(--deep) 42%,transparent);

  --header-h: 60px;
  accent-color: var(--sky);
  color-scheme: light;
}

*{box-sizing:border-box;min-inline-size:0;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--f-body);
  background:var(--paper);
  color:var(--ink);
  line-height:1.7;
  font-size:var(--t-base);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-block-size:100svb;
  overflow-x:hidden;               /* حارس ضد التمرير الأفقي */
}
:lang(ar){letter-spacing:normal;}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.3;margin:0;text-wrap:balance;color:var(--ink);}
p{margin:0;text-wrap:pretty;}
a{color:inherit;text-decoration:none;}
img{max-inline-size:100%;display:block;}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit;border:none;background:none;padding:0;}
input,select,textarea{font-family:inherit;font-size:inherit;}
ul{margin:0;padding:0;list-style:none;}
:focus-visible{outline:2.5px solid var(--sky);outline-offset:2px;border-radius:6px;}
::selection{background:var(--sky-soft);}
.tnum{font-variant-numeric:tabular-nums;}
.num{unicode-bidi:isolate;}
.sr-only{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;}
.hidden{display:none !important;}
.wrap{inline-size:min(1160px,100% - 2rem);margin-inline:auto;}

/* ---- شبكة قابلة للسحب أفقياً (rails) ---- */
.rail{display:flex;flex-wrap:nowrap;gap:var(--s3);overflow-x:auto;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  padding-block-end:var(--s2);margin-inline:calc(-1 * var(--s1));padding-inline:var(--s1);
  scrollbar-width:thin;scrollbar-color:var(--sky-border) transparent;}
.rail>*{scroll-snap-align:start;flex:0 0 auto;}
.rail::-webkit-scrollbar{block-size:7px;}
.rail::-webkit-scrollbar-thumb{background:var(--sky-border);border-radius:99px;}

/* ============================================================
   الأزرار
   ============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  padding:.72rem 1.15rem;border-radius:var(--r-pill);font-weight:700;font-size:var(--t-base);
  min-block-size:44px;transition:background .16s,box-shadow .16s,transform .1s,border-color .16s,color .16s;}
.btn svg{inline-size:20px;block-size:20px;flex:none;}
.btn:active{transform:translateY(1px);}
.btn--primary{background:var(--sky);color:#fff;box-shadow:0 8px 18px -12px color-mix(in oklch,var(--sky) 85%,transparent);}
.btn--primary:hover{background:var(--sky-strong);}
.btn--outline{background:var(--surface);border:1.5px solid var(--border-2);color:var(--deep-strong);}
.btn--outline:hover{border-color:var(--sky-border);background:var(--sky-tint);}
.btn--ghost{background:transparent;color:var(--deep-strong);}
.btn--ghost:hover{background:var(--sky-tint);}
.btn--sun{background:var(--sun);color:var(--sun-ink);}
.btn--sun:hover{background:var(--sun-strong);color:#3a2e05;}
.btn--block{inline-size:100%;}
.btn--sm{min-block-size:38px;padding:.5rem .85rem;font-size:var(--t-sm);}
.btn--sm svg{inline-size:17px;block-size:17px;}

.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  min-inline-size:44px;min-block-size:44px;padding:.5rem;border-radius:var(--r-pill);
  border:1.5px solid transparent;color:var(--deep-strong);font-weight:600;font-size:var(--t-sm);
  position:relative;transition:background .15s,border-color .15s,color .15s;}
.iconbtn svg{inline-size:21px;block-size:21px;flex:none;}
.iconbtn:hover{background:var(--sky-tint);}
.iconbtn--pill{padding-inline:.9rem;border-color:var(--border-2);background:var(--surface);}
.iconbtn--pill:hover{border-color:var(--sky-border);}
.iconbtn--solid{background:var(--sky);color:#fff;border-color:var(--sky);}
.iconbtn--solid:hover{background:var(--sky-strong);color:#fff;}
.badge-count{position:absolute;inset-block-start:2px;inset-inline-start:2px;
  min-inline-size:17px;block-size:17px;padding-inline:4px;border-radius:99px;
  background:var(--sun);color:var(--sun-ink);font-size:10px;font-weight:800;
  display:grid;place-items:center;line-height:1;}

/* ============================================================
   الهيدر (مضغوط)
   ============================================================ */
.topbar{position:sticky;inset-block-start:0;z-index:50;background:var(--surface);
  border-block-end:1px solid var(--border);}
.topbar__row{display:flex;align-items:center;gap:var(--s2);min-block-size:var(--header-h);}
.brand{display:flex;align-items:center;gap:var(--s2);flex:none;}
.brand__logo{inline-size:38px;block-size:38px;object-fit:contain;
  filter:drop-shadow(0 2px 4px color-mix(in oklch,var(--deep) 26%,transparent));}
.brand__name{display:flex;flex-direction:column;line-height:1.05;}
.brand__name b{font-family:var(--f-display);font-weight:800;font-size:1rem;color:var(--deep-strong);letter-spacing:.2px;}
.brand__name span{font-size:.66rem;color:var(--muted);font-weight:500;}
.nav{display:none;align-items:center;gap:var(--s1);margin-inline-start:var(--s3);}
.nav a{padding:.5rem .7rem;border-radius:var(--r-sm);font-weight:600;font-size:var(--t-sm);color:var(--ink-soft);
  transition:background .15s,color .15s;}
.nav a:hover{background:var(--sky-tint);color:var(--deep-strong);}
.nav a[aria-current="page"]{color:var(--sky-strong);background:var(--sky-tint);}
.topbar__spacer{margin-inline-start:auto;}
.top-actions{display:flex;align-items:center;gap:var(--s1);flex:none;}

/* بحث الهيدر (Desktop) */
.hsearch{display:none;position:relative;flex:1;max-inline-size:420px;margin-inline:var(--s3);}
.hsearch .search{inline-size:100%;}

/* حقل بحث موحّد */
.search{position:relative;display:flex;align-items:center;gap:var(--s2);
  background:var(--surface);border:1.5px solid var(--border-2);border-radius:var(--r-pill);
  padding-inline:.9rem .35rem;transition:border-color .15s,box-shadow .15s;}
.search:focus-within{border-color:var(--sky);box-shadow:0 0 0 3px var(--sky-soft);}
.search__ic{inline-size:20px;block-size:20px;color:var(--muted);flex:none;display:grid;place-items:center;}
.search__ic svg{inline-size:20px;block-size:20px;}
.search input{flex:1;border:none;background:none;outline:none;padding-block:.6rem;font-size:var(--t-base);color:var(--ink);}
.search input::placeholder{color:var(--muted);}
.search__clear{inline-size:34px;block-size:34px;border-radius:50%;place-items:center;color:var(--muted);flex:none;display:none;}
.search__clear svg{inline-size:16px;block-size:16px;}
.search__clear:hover{background:var(--sky-tint);color:var(--sky-strong);}
.search.has-value .search__clear{display:grid;}

/* لوحة اقتراحات البحث */
.suggest{position:absolute;inset-inline:0;inset-block-start:calc(100% + 8px);z-index:60;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-lift);
  overflow:hidden;max-block-size:min(70svh,460px);overflow-y:auto;}
.suggest__group{padding:var(--s2);}
.suggest__group+.suggest__group{border-block-start:1px solid var(--border);}
.suggest__label{font-size:var(--t-2xs);font-weight:700;color:var(--muted);padding:.25rem .6rem;}
.suggest__item{display:flex;align-items:center;gap:var(--s3);inline-size:100%;text-align:start;
  padding:.55rem .6rem;border-radius:var(--r-sm);transition:background .12s;}
.suggest__item:hover,.suggest__item.is-active{background:var(--sky-tint);}
.suggest__thumb{inline-size:38px;block-size:38px;border-radius:9px;background:var(--sky-tint);
  display:grid;place-items:center;color:var(--sky-strong);flex:none;overflow:hidden;}
.suggest__thumb img{inline-size:100%;block-size:100%;object-fit:cover;}
.suggest__thumb svg{inline-size:20px;block-size:20px;}
.suggest__txt{display:flex;flex-direction:column;gap:1px;min-inline-size:0;}
.suggest__txt b{font-size:var(--t-sm);color:var(--deep-strong);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.suggest__txt span{font-size:var(--t-2xs);color:var(--muted);}
.suggest__empty{padding:var(--s5);text-align:center;color:var(--muted);font-size:var(--t-sm);}

/* ============================================================
   شريط بحث الموبايل (سطر ثانٍ في الهيدر)
   ============================================================ */
.msearch{display:block;padding-block:0 var(--s2);position:relative;}
body[data-route="admin"] .msearch,
body[data-route="product"] .msearch{display:none;}

/* ============================================================
   انتقال المشاهد
   ============================================================ */
.view{animation:viewIn .28s cubic-bezier(.2,.7,.2,1);}
@keyframes viewIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ============================================================
   الهيرو (مضغوط، قيمة واضحة)
   ============================================================ */
.hero{padding-block:var(--s6) var(--s4);}
.hero__card{position:relative;overflow:hidden;background:
    radial-gradient(120% 120% at 100% 0, var(--sky-tint), transparent 55%),
    var(--surface);
  border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--sh);
  padding:var(--s6);display:grid;gap:var(--s5);}
.hero__badge{display:inline-flex;align-items:center;gap:.4rem;align-self:start;
  background:var(--sun-soft);color:var(--sun-ink);padding:.28rem .7rem;border-radius:var(--r-pill);
  font-weight:700;font-size:var(--t-xs);border:1px solid color-mix(in oklch,var(--sun) 40%,white);}
.hero__title{font-size:var(--t-hero);color:var(--deep-strong);}
.hero__title .en{display:block;font-size:.36em;letter-spacing:3px;color:var(--sky-strong);font-weight:700;margin-block-start:.3rem;}
.hero__tag{font-size:var(--t-base);color:var(--ink-soft);max-inline-size:46ch;}
.hero__search{position:relative;z-index:2;}
.hero__search .search{box-shadow:var(--sh-sm);}
.hero__cta{display:flex;flex-wrap:wrap;gap:var(--s2);}
.hero__logo{display:none;}

/* ============================================================
   عنوان قسم عام
   ============================================================ */
.shead{display:flex;align-items:center;gap:var(--s3);margin-block:var(--s8) var(--s4);}
.shead__t{display:flex;flex-direction:column;gap:2px;}
.shead h2{font-size:var(--t-xl);color:var(--deep-strong);}
.shead__sub{font-size:var(--t-xs);color:var(--muted);}
.shead .more{margin-inline-start:auto;flex:none;font-size:var(--t-sm);font-weight:700;color:var(--sky-strong);
  display:inline-flex;align-items:center;gap:.25rem;padding:.4rem .5rem;border-radius:var(--r-sm);}
.shead .more:hover{background:var(--sky-tint);}
.shead .more svg{inline-size:16px;block-size:16px;}
[dir="rtl"] .shead .more svg{transform:scaleX(-1);}

/* ============================================================
   شنو تحتاج اليوم؟ (Quick Needs)
   ============================================================ */
.needs{margin-block:var(--s5);}
.need{display:inline-flex;align-items:center;gap:var(--s2);flex:0 0 auto;white-space:nowrap;
  padding:.5rem .9rem .5rem .5rem;border-radius:var(--r-pill);
  background:var(--surface);border:1.5px solid var(--border-2);
  font-weight:700;font-size:var(--t-sm);color:var(--deep-strong);
  transition:border-color .15s,background .15s,transform .1s;scroll-snap-align:start;}
.need:hover{border-color:var(--sky-border);background:var(--sky-tint);}
.need:active{transform:translateY(1px);}
.need__ic{inline-size:32px;block-size:32px;border-radius:50%;display:grid;place-items:center;
  background:var(--sky-tint);color:var(--sky-strong);flex:none;}
.need__ic svg{inline-size:19px;block-size:19px;}

/* ============================================================
   الأقسام (Categories) — مضغوطة
   ============================================================ */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);}
.cat{--ga:var(--sky);position:relative;display:flex;align-items:center;gap:var(--s3);
  text-align:start;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);
  padding:var(--s3);box-shadow:var(--sh-sm);transition:border-color .16s,box-shadow .16s,transform .12s;overflow:hidden;}
.cat::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;inline-size:4px;background:var(--ga);}
.cat:hover{border-color:color-mix(in oklch,var(--ga) 45%,white);box-shadow:var(--sh);transform:translateY(-2px);}
.cat__ic{inline-size:46px;block-size:46px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:color-mix(in oklch,var(--ga) 14%,white);color:var(--ga);}
.cat__ic svg{inline-size:26px;block-size:26px;}
.cat__t{display:flex;flex-direction:column;gap:1px;min-inline-size:0;}
.cat__t b{font-family:var(--f-display);font-weight:800;font-size:var(--t-base);color:var(--deep-strong);}
.cat__t span{font-size:var(--t-2xs);color:var(--muted);}

/* ============================================================
   بطاقة المنتج (موحّدة)
   ============================================================ */
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s3);}
/* شريط منتجات أفقي (لأقسام الاكتشاف على الموبايل) */
.prail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(148px,44%);gap:var(--s3);
  overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  padding-block-end:var(--s2);margin-inline:calc(-1 * var(--s1));padding-inline:var(--s1);
  scrollbar-width:thin;scrollbar-color:var(--sky-border) transparent;}
.prail>.pcard{scroll-snap-align:start;}
.prail::-webkit-scrollbar{block-size:7px;}
.prail::-webkit-scrollbar-thumb{background:var(--sky-border);border-radius:99px;}
@media(min-width:480px){.prail{grid-auto-columns:minmax(160px,31%);}}
@media(min-width:768px){.prail{grid-auto-columns:minmax(180px,23%);}}
@media(min-width:1024px){.prail{grid-auto-columns:minmax(190px,19%);}}
.pcard{position:relative;display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-sm);
  transition:border-color .16s,box-shadow .16s,transform .12s;}
.pcard:hover{border-color:var(--sky-border);box-shadow:var(--sh);transform:translateY(-2px);}
.pcard__media{position:relative;aspect-ratio:1/1;background:var(--sky-tint);display:grid;place-items:center;overflow:hidden;}
.pcard__media img{inline-size:100%;block-size:100%;object-fit:cover;}
.pcard__ph{color:color-mix(in oklch,var(--sky) 42%,white);}
.pcard__ph svg{inline-size:52px;block-size:52px;}
.pcard__fav{position:absolute;inset-block-start:6px;inset-inline-end:6px;z-index:2;
  inline-size:36px;block-size:36px;border-radius:50%;display:grid;place-items:center;
  background:color-mix(in oklch,var(--surface) 82%,transparent);backdrop-filter:blur(4px);
  color:var(--muted);box-shadow:var(--sh-sm);transition:color .15s,transform .12s,background .15s;}
.pcard__fav svg{inline-size:19px;block-size:19px;}
.pcard__fav:hover{color:var(--danger);}
.pcard__fav[aria-pressed="true"]{color:var(--danger);}
.pcard__fav[aria-pressed="true"] svg{fill:currentColor;animation:pop .28s cubic-bezier(.2,.7,.2,1);}
@keyframes pop{0%{transform:scale(.6);}60%{transform:scale(1.18);}100%{transform:scale(1);}}
.pcard__badge{position:absolute;inset-block-start:6px;inset-inline-start:6px;z-index:2;
  display:inline-flex;align-items:center;gap:.25rem;padding:.2rem .5rem;border-radius:var(--r-pill);
  font-size:var(--t-2xs);font-weight:700;backdrop-filter:blur(4px);}
.pcard__badge svg{inline-size:12px;block-size:12px;}
.badge--ok{background:color-mix(in oklch,var(--ok-soft) 92%,transparent);color:var(--ok);border:1px solid var(--ok-border);}
.badge--off{background:color-mix(in oklch,var(--off-soft) 92%,transparent);color:var(--off);border:1px solid color-mix(in oklch,var(--off) 26%,white);}
.pcard__body{padding:var(--s3);display:flex;flex-direction:column;gap:.35rem;flex:1;}
.pcard__name{font-family:var(--f-display);font-weight:700;font-size:var(--t-sm);color:var(--deep-strong);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pcard__use{font-size:var(--t-xs);color:var(--muted);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pcard__foot{margin-block-start:auto;display:flex;align-items:center;gap:var(--s2);padding-block-start:.35rem;}
.pcard__co{font-size:var(--t-2xs);color:var(--ink-soft);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pcard__go{margin-inline-start:auto;flex:none;font-size:var(--t-2xs);font-weight:700;color:var(--sky-strong);
  display:inline-flex;align-items:center;gap:.2rem;}
.pcard__go svg{inline-size:15px;block-size:15px;}
[dir="rtl"] .pcard__go svg{transform:scaleX(-1);}

/* ============================================================
   بطاقة استخدام (Browse by use)
   ============================================================ */
.uses{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s3);}
.use{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);border-radius:var(--r);
  background:var(--surface);border:1.5px solid var(--border);box-shadow:var(--sh-sm);text-align:start;
  transition:border-color .15s,transform .12s,box-shadow .15s;}
.use:hover{border-color:var(--sky-border);transform:translateY(-2px);box-shadow:var(--sh);}
.use__ic{inline-size:42px;block-size:42px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:var(--sun-soft);color:var(--sun-ink);}
.use__ic svg{inline-size:23px;block-size:23px;}
.use__t{display:flex;flex-direction:column;}
.use__t b{font-weight:700;font-size:var(--t-sm);color:var(--deep-strong);}
.use__t span{font-size:var(--t-2xs);color:var(--muted);}

/* ============================================================
   لماذا Home Needs؟
   ============================================================ */
.why{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s5);}
.why__item{display:flex;gap:var(--s3);align-items:flex-start;}
.why__ic{inline-size:40px;block-size:40px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:var(--surface);color:var(--sky-strong);border:1px solid var(--border);}
.why__ic svg{inline-size:22px;block-size:22px;}
.why__t b{display:block;font-weight:700;font-size:var(--t-sm);color:var(--deep-strong);}
.why__t span{font-size:var(--t-xs);color:var(--muted);line-height:1.5;}

/* ============================================================
   CTA ختامي
   ============================================================ */
.final{margin-block:var(--s10) var(--s6);text-align:center;
  background:linear-gradient(160deg,var(--sky) ,var(--sky-deep));color:#fff;border-radius:var(--r-xl);
  padding:var(--s10) var(--s5);}
.final h2{color:#fff;font-size:var(--t-2xl);}
.final p{color:color-mix(in oklch,#fff 82%,transparent);margin-block:var(--s2) var(--s5);font-size:var(--t-sm);}

/* ============================================================
   شريط تصنيفات فرعية (chips)
   ============================================================ */
.chips{display:flex;gap:var(--s2);margin-block:var(--s3) var(--s5);}
.chip{white-space:nowrap;flex:none;padding:.5rem 1rem;border-radius:var(--r-pill);min-block-size:40px;
  border:1.5px solid var(--border-2);background:var(--surface);color:var(--deep-strong);
  font-weight:600;font-size:var(--t-sm);transition:background .15s,border-color .15s,color .15s;scroll-snap-align:start;}
.chip:hover{background:var(--sky-tint);border-color:var(--sky-border);}
.chip[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:#fff;}
.chip .c{opacity:.7;font-weight:500;margin-inline-start:.15rem;}

/* ============================================================
   Breadcrumb + رجوع
   ============================================================ */
.crumbs{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-block:var(--s5) var(--s3);
  font-size:var(--t-xs);color:var(--muted);}
.crumbs a{color:var(--sky-strong);font-weight:600;}
.crumbs a:hover{text-decoration:underline;}
.crumbs .sep{opacity:.5;}
.backbtn{display:inline-flex;align-items:center;gap:var(--s2);margin-block:var(--s4) var(--s3);
  padding:.5rem .85rem;border-radius:var(--r-pill);border:1.5px solid var(--border-2);background:var(--surface);
  font-weight:600;font-size:var(--t-sm);color:var(--deep-strong);min-block-size:40px;}
.backbtn:hover{background:var(--sky-tint);border-color:var(--sky-border);}
.backbtn svg{inline-size:18px;block-size:18px;}

/* ============================================================
   صفحة المنتج (Product Detail)
   ============================================================ */
.pd{display:grid;gap:var(--s5);margin-block-end:var(--s6);}
.pd__media{position:relative;aspect-ratio:4/3;background:var(--sky-tint);border-radius:var(--r-lg);
  overflow:hidden;display:grid;place-items:center;border:1px solid var(--border);}
.pd__media img{inline-size:100%;block-size:100%;object-fit:cover;}
.pd__ph svg{inline-size:88px;block-size:88px;color:color-mix(in oklch,var(--sky) 40%,white);}
.pd__info{display:flex;flex-direction:column;gap:var(--s3);}
.pd__head{display:flex;align-items:flex-start;gap:var(--s3);}
.pd__title{font-size:var(--t-2xl);color:var(--deep-strong);flex:1;}
.pd__fav{inline-size:46px;block-size:46px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:1.5px solid var(--border-2);background:var(--surface);color:var(--muted);}
.pd__fav svg{inline-size:22px;block-size:22px;}
.pd__fav[aria-pressed="true"]{color:var(--danger);border-color:var(--danger-soft);}
.pd__fav[aria-pressed="true"] svg{fill:currentColor;}
.pd__meta{display:flex;flex-wrap:wrap;gap:var(--s2);}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .7rem;border-radius:var(--r-pill);
  font-size:var(--t-xs);font-weight:700;background:var(--sky-tint);color:var(--sky-strong);border:1px solid var(--sky-border);}
.pill svg{inline-size:14px;block-size:14px;}
.pill--ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-border);}
.pill--off{background:var(--off-soft);color:var(--off);border-color:color-mix(in oklch,var(--off) 26%,white);}
.pd__desc{color:var(--ink-soft);font-size:var(--t-sm);line-height:1.8;}
.pd__specs{display:grid;gap:.1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.pd__spec{display:flex;gap:var(--s3);padding:.6rem .9rem;font-size:var(--t-sm);}
.pd__spec:nth-child(odd){background:var(--surface-2);}
.pd__spec b{color:var(--muted);font-weight:600;min-inline-size:6rem;flex:none;}
.pd__spec span{color:var(--ink);font-weight:500;}
.pd__actions{display:flex;flex-wrap:wrap;gap:var(--s2);}

/* ============================================================
   الحالات: هيكل عظمي / فارغ / خطأ
   ============================================================ */
.sk{background:linear-gradient(100deg,var(--surface-2) 30%,var(--sky-tint) 50%,var(--surface-2) 70%);
  background-size:200% 100%;animation:sk 1.2s ease-in-out infinite;border-radius:var(--r-sm);}
@keyframes sk{0%{background-position:150% 0;}100%{background-position:-50% 0;}}
.skcard{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface);}
.skcard .sk-media{aspect-ratio:1/1;border-radius:0;}
.skcard .sk-line{block-size:11px;margin:var(--s3) var(--s3) 0;}
.skcard .sk-line.sh{inline-size:60%;}
.skcard .sk-line.last{margin-block-end:var(--s4);}

.state{grid-column:1/-1;text-align:center;padding:var(--s12) var(--s5);color:var(--muted);}
.state__ic{inline-size:64px;block-size:64px;border-radius:20px;display:grid;place-items:center;margin-inline:auto;
  background:var(--sky-tint);color:var(--sky-border);margin-block-end:var(--s3);}
.state__ic svg{inline-size:34px;block-size:34px;}
.state h3{color:var(--ink-soft);font-size:var(--t-lg);margin-block-end:var(--s1);}
.state p{font-size:var(--t-sm);max-inline-size:42ch;margin-inline:auto;margin-block-end:var(--s4);}
.state__sug{display:flex;flex-wrap:wrap;gap:var(--s2);justify-content:center;}

/* ============================================================
   الفوتر
   ============================================================ */
.footer{margin-block-start:var(--s12);background:var(--deep-strong);color:#eaf4fb;}
.footer__in{display:grid;gap:var(--s6);padding-block:var(--s8);}
.footer h4{color:#fff;font-size:var(--t-base);margin-block-end:var(--s3);font-weight:700;}
.footer p,.footer a{color:color-mix(in oklch,#eaf4fb 82%,transparent);font-size:var(--t-sm);line-height:1.8;}
.footer__brand{display:flex;gap:var(--s3);align-items:center;margin-block-end:var(--s3);}
.footer__brand img{inline-size:46px;block-size:46px;object-fit:contain;}
.footer__brand b{font-family:var(--f-display);font-weight:800;font-size:1.1rem;color:#fff;}
.foot-link{display:flex;align-items:center;gap:var(--s2);margin-block:.45rem 0;transition:color .15s;}
.foot-link svg{inline-size:18px;block-size:18px;color:var(--sky);flex:none;}
.foot-link:hover{color:#fff;}
.foot-nav a{display:block;margin-block:.4rem 0;}
.foot-nav a:hover{color:#fff;}
.socials{display:flex;gap:var(--s2);margin-block-start:var(--s3);}
.social{inline-size:42px;block-size:42px;border-radius:12px;display:grid;place-items:center;
  background:color-mix(in oklch,var(--sky) 22%,var(--deep-strong));color:#fff;transition:background .15s,transform .1s;}
.social:hover{background:var(--sky);transform:translateY(-2px);}
.social svg{inline-size:20px;block-size:20px;}
.footer__bar{border-block-start:1px solid color-mix(in oklch,#fff 12%,transparent);padding-block:var(--s4);
  display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap;
  font-size:var(--t-2xs);color:color-mix(in oklch,#eaf4fb 62%,transparent);}
.footer__note{font-size:var(--t-2xs);color:color-mix(in oklch,#eaf4fb 55%,transparent);margin-block-start:var(--s2);}

/* ============================================================
   المودال + التوست
   ============================================================ */
.modal-back{position:fixed;inset:0;z-index:80;background:color-mix(in oklch,var(--deep-strong) 55%,transparent);
  backdrop-filter:blur(3px);display:grid;place-items:end center;padding:0;animation:fade .2s;}
@media(min-width:640px){.modal-back{place-items:center;padding:var(--s4);}}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal{background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--sh-lift);
  inline-size:100%;max-block-size:92svh;overflow:auto;animation:sheet .26s cubic-bezier(.2,.7,.2,1);}
@media(min-width:640px){.modal{border-radius:var(--r-lg);inline-size:min(620px,100%);animation:pop .24s cubic-bezier(.2,.7,.2,1);}}
@keyframes sheet{from{transform:translateY(100%);}to{transform:none;}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}
.modal__head{position:sticky;inset-block-start:0;background:var(--surface);display:flex;align-items:center;
  justify-content:space-between;gap:var(--s3);padding:var(--s4) var(--s5);border-block-end:1px solid var(--border);z-index:1;}
.modal__head h3{font-size:var(--t-lg);color:var(--deep-strong);}
.modal__body{padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4);}
.modal__foot{position:sticky;inset-block-end:0;background:var(--surface);display:flex;gap:var(--s3);justify-content:flex-end;
  padding:var(--s4) var(--s5);border-block-start:1px solid var(--border);}

.toast{position:fixed;inset-block-end:1.1rem;inset-inline:0;margin-inline:auto;z-index:90;inline-size:max-content;max-inline-size:90vw;
  background:var(--deep-strong);color:#fff;padding:.7rem 1.15rem;border-radius:var(--r-pill);font-weight:600;font-size:var(--t-sm);
  box-shadow:var(--sh-lift);display:flex;align-items:center;gap:var(--s2);animation:toastIn .3s cubic-bezier(.2,.7,.2,1);}
.toast svg{inline-size:18px;block-size:18px;color:var(--sun);}
@keyframes toastIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

/* ============================================================
   Responsive (Mobile-first → up)
   ============================================================ */
@media(min-width:480px){
  .pgrid{grid-template-columns:repeat(3,1fr);}
  .cats{grid-template-columns:repeat(2,1fr);}
  .uses{grid-template-columns:repeat(3,1fr);}
}
@media(min-width:768px){
  :root{--header-h:66px;}
  .msearch{display:none;}
  .hsearch{display:block;}
  .nav{display:flex;}
  .brand__logo{inline-size:42px;block-size:42px;}
  .hero{padding-block:var(--s10) var(--s6);}
  .hero__card{grid-template-columns:1.2fr .8fr;align-items:center;padding:var(--s10);gap:var(--s8);}
  .hero__logo{display:grid;place-items:center;}
  .hero__logo img{inline-size:min(220px,80%);filter:drop-shadow(0 16px 26px color-mix(in oklch,var(--deep) 30%,transparent));}
  .hero__text{display:flex;flex-direction:column;gap:var(--s4);align-items:flex-start;}
  .cats{grid-template-columns:repeat(3,1fr);}
  .pgrid{grid-template-columns:repeat(4,1fr);}
  .uses{grid-template-columns:repeat(4,1fr);}
  .why{grid-template-columns:repeat(4,1fr);}
  .footer__in{grid-template-columns:1.5fr 1fr 1fr;gap:var(--s8);}
  .pd{grid-template-columns:1fr 1fr;align-items:start;gap:var(--s8);}
  .pd__media{aspect-ratio:1/1;position:sticky;inset-block-start:calc(var(--header-h) + var(--s4));}
}
@media(min-width:1024px){
  .pgrid{grid-template-columns:repeat(5,1fr);}
}

/* ============================================================
   حركة مخفّضة
   ============================================================ */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}

</style>

/* ============================================================
   2) طبقة التخزين (Storage adapter) — قابلة للتبديل
      اليوم: localStorage. غداً: API/Supabase بنفس الواجهة.
   ============================================================ */
var Storage = {
  KEY:"homeneeds_iq_v2",
  FAV:"homeneeds_iq_fav",
  UNLOCK:"homeneeds_iq_unlock",
  read:function(){ try{var r=localStorage.getItem(this.KEY);return r?JSON.parse(r):null;}catch(e){return null;} },
  write:function(obj){ try{localStorage.setItem(this.KEY,JSON.stringify(obj));return true;}catch(e){return false;} },
  clear:function(){ try{localStorage.removeItem(this.KEY);}catch(e){} },
  readFav:function(){ try{var r=localStorage.getItem(this.FAV);return r?JSON.parse(r):[];}catch(e){return [];} },
  writeFav:function(a){ try{localStorage.setItem(this.FAV,JSON.stringify(a));}catch(e){} },
  isUnlocked:function(){ try{return sessionStorage.getItem(this.UNLOCK)==="1";}catch(e){return false;} },
  setUnlocked:function(v){ try{ v?sessionStorage.setItem(this.UNLOCK,"1"):sessionStorage.removeItem(this.UNLOCK);}catch(e){} }
};

/* ============================================================
   3) سجلّ الاستخدامات (Usage taxonomy) — يُبنى منه: شنو تحتاج + تصفّح حسب الاستخدام
   ============================================================ */
var USAGES = {
  degrease:{label:"إزالة الدهون", full:"مزيلات الدهون", icon:"spray", quick:true},
  stains:  {label:"إزالة البقع",  full:"مزيلات البقع",  icon:"sparkle", quick:true},
  laundry: {label:"غسيل الملابس", full:"مستلزمات الغسيل", icon:"shirt", quick:true},
  dishes:  {label:"غسيل الأطباق", full:"صابون وأطباق",   icon:"bubbles", quick:true},
  fragrance:{label:"تعطير ونعومة",full:"معطّرات ومنعّمات", icon:"drop", quick:true},
  floors:  {label:"الأرضيات",     full:"تنظيف الأرضيات",  icon:"floor", quick:true},
  tools:   {label:"أدوات التنظيف",full:"أدوات وتجهيزات",  icon:"broom", quick:true},
  kitchen: {label:"للمطبخ",       full:"منتجات المطبخ",   icon:"kitchen", quick:false},
  rust:    {label:"إزالة الصدأ",  full:"مزيلات الصدأ",    icon:"wash", quick:false},
  carpet:  {label:"السجاد والمفروشات", full:"السجاد والمفروشات", icon:"home", quick:false},
  occasions:{label:"مناسبات وسفر",full:"مستلزمات المناسبات", icon:"cup", quick:false}
};
/* اشتقاق وسوم الاستخدام لمنتج (احتياطي إن لم تكن مخزّنة) */
function deriveUsage(p){
  var t=(p.name+" "+(p.use||"")).toLowerCase(), sub=p.subId||"", out={};
  function add(k){out[k]=1;}
  if(/دهن|دهون|شحوم|مطبخ|موقد|فرن|شفاط/.test(t)){add("degrease");add("kitchen");}
  if(/صدأ/.test(t)) add("rust");
  if(/بقع|بقعة/.test(t)) add("stains");
  if(/سجاد|مفروش|موكيت/.test(t)) add("carpet");
  if(sub==="laundry"||sub==="tide"||/غسول|تايت|غسيل|ملابس|أقمشة|منعّم|منعم/.test(t)) add("laundry");
  if(/معطّر|معطر|رائحة|منعّم|منعم|نعوم/.test(t)) add("fragrance");
  if(sub==="soap"||/صابون|أطباق|أواني|جلي/.test(t)){add("dishes");}
  if(/فرش|فرشاة|أدوات|طقم|ممسحة|مكنس/.test(t)){add("tools");add("floors");}
  if(/ورقي|رحلات|مناسبات|سفر|استعمال مرة/.test(t)) add("occasions");
  if(sub==="degreaser") add("degrease");
  if(sub==="stain") add("stains");
  var keys=Object.keys(out);
  return keys.length?keys:["tools"];
}

/* ============================================================
   4) البذرة + الترحيل (migration)
   ============================================================ */
function loadSeed(){
  try{return JSON.parse($("#seed-data").textContent);}
  catch(e){return {shop:{},sections:[],products:[]};}
}
function migrate(data){
  data=data||{}; data.shop=data.shop||{}; data.sections=data.sections||[]; data.products=data.products||[];
  var base=Date.parse("2026-08-01T09:00:00Z");
  data.products.forEach(function(p,i){
    if(!p.id) p.id=uid("p");
    if(typeof p.available!=="boolean") p.available=true;
    if(!p.createdAt) p.createdAt=base + i*86400000;      // ترتيب زمني ثابت للاشتقاق "وصل حديثاً"
    if(!Array.isArray(p.usage)||!p.usage.length) p.usage=deriveUsage(p);
    if(typeof p.featured!=="boolean") p.featured=false;
    if(p.company==null) p.company="—";
    if(p.origin==null)  p.origin="—";
    if(p.desc==null)    p.desc="";
    if(p.size==null)    p.size="";
  });
  data.version=2;
  return data;
}

/* ============================================================
   5) طبقة النطاق/المستودع (Repository) — كل منطق الأعمال هنا
      الواجهة لا تلمس localStorage مباشرة إطلاقاً.
   ============================================================ */
var db = {
  _d:null, _fav:null, error:null,
  init:function(){
    try{
      var raw=Storage.read();
      if(!raw){                              // ترحيل بيانات النسخة القديمة (v1) إن وُجدت
        try{ var old=localStorage.getItem("homeneeds_data_v1"); if(old){ raw=JSON.parse(old); } }catch(e){}
      }
      this._d = raw ? migrate(raw) : migrate(loadSeed());
      this._fav = Storage.readFav();
    }catch(e){ this.error=e; this._d=migrate(loadSeed()); this._fav=[]; }
  },
  save:function(){ return Storage.write(this._d); },
  resetToSeed:function(){ Storage.clear(); this._d=migrate(loadSeed()); this.save(); },
  /* المحل */
  shop:function(){ return this._d.shop||{}; },
  setShop:function(patch){ this._d.shop=Object.assign(this._d.shop||{},patch); this.save(); },
  /* الأقسام */
  categories:function(){ return this._d.sections||[]; },
  category:function(id){ return (this._d.sections||[]).find(function(s){return s.id===id;})||null; },
  subName:function(cat,subId){ if(!cat)return""; var s=(cat.subs||[]).find(function(x){return x.id===subId;}); return s?s.name:""; },
  hasSubs:function(cat){ var s=(cat&&cat.subs)||[]; return s.length>1 || (s.length===1 && s[0].id!=="general"); },
  /* المنتجات */
  products:function(){ return this._d.products||[]; },
  product:function(id){ return (this._d.products||[]).find(function(p){return p.id===id;})||null; },
  byCategory:function(id){ return this.products().filter(function(p){return p.sectionId===id;}); },
  bySub:function(cat,sub){ return this.products().filter(function(p){return p.sectionId===cat && p.subId===sub;}); },
  byUsage:function(tag){ return this.products().filter(function(p){return (p.usage||[]).indexOf(tag)>=0;}); },
  byBrand:function(name){ return this.products().filter(function(p){return (p.company||"—")===name;}); },
  featured:function(limit){
    var f=this.products().filter(function(p){return p.featured;});
    if(f.length<4){ // احتياطي: لو ما في مميّز كافٍ، اعرض عيّنة متنوعة (وسمّها "اختياراتنا" لا "الأكثر مبيعاً")
      var seen={}, extra=[];
      this.products().forEach(function(p){ if(!p.featured && !seen[p.sectionId]){seen[p.sectionId]=1;extra.push(p);} });
      f=f.concat(extra);
    }
    return limit?f.slice(0,limit):f;
  },
  newArrivals:function(limit){
    return this.products().slice().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);}).slice(0,limit||10);
  },
  brands:function(){
    var m={}; this.products().forEach(function(p){var c=p.company||"—"; if(c&&c!=="—") m[c]=(m[c]||0)+1;});
    return Object.keys(m).map(function(k){return {name:k,count:m[k]};}).sort(function(a,b){return b.count-a.count;});
  },
  usagesWithProducts:function(onlyQuick){
    var self=this;
    return Object.keys(USAGES).filter(function(k){
      if(onlyQuick && !USAGES[k].quick) return false;
      return self.byUsage(k).length>0;
    });
  },
  saveProduct:function(p){
    var arr=this._d.products; var i=arr.findIndex(function(x){return x.id===p.id;});
    if(!p.id) p.id=uid("p");
    if(!p.createdAt) p.createdAt=Date.now();
    if(!Array.isArray(p.usage)||!p.usage.length) p.usage=deriveUsage(p);
    if(i>=0) arr[i]=Object.assign(arr[i],p); else arr.push(p);
    this.save(); return p;
  },
  deleteProduct:function(id){ this._d.products=this.products().filter(function(p){return p.id!==id;}); this.save(); },
  /* المفضّلة */
  favIds:function(){ return this._fav||[]; },
  isFav:function(id){ return (this._fav||[]).indexOf(id)>=0; },
  favProducts:function(){ var self=this; return (this._fav||[]).map(function(id){return self.product(id);}).filter(Boolean); },
  toggleFav:function(id){
    var i=(this._fav||[]).indexOf(id);
    if(i>=0) this._fav.splice(i,1); else this._fav.unshift(id);
    Storage.writeFav(this._fav); return this.isFav(id);
  }
};

/* ============================================================
   6) تطبيع عربي + محرّك البحث (منتجات/أقسام/شركات/استخدام)
   ============================================================ */
function normalizeAr(str){
  return (str==null?"":String(str))
    .replace(/[\u064B-\u065F\u0670]/g,"").replace(/\u0640/g,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ئ/g,"ي").replace(/ؤ/g,"و").replace(/ة/g,"ه")
    .replace(/\s+/g," ").trim().toLowerCase();
}
function searchAll(q){
  var toks=normalizeAr(q).split(" ").filter(Boolean);
  var res={products:[],categories:[],brands:[],usages:[]};
  if(!toks.length) return res;
  function hit(hay){var h=normalizeAr(hay);return toks.every(function(t){return h.indexOf(t)>=0;});}
  db.products().forEach(function(p){
    var cat=db.category(p.sectionId)||{};
    if(hit([p.name,p.use,p.desc,p.company,p.origin,cat.name,db.subName(cat,p.subId)].join(" ")))
      res.products.push(p);
  });
  db.categories().forEach(function(c){ if(hit(c.name+" "+(c.desc||""))) res.categories.push(c); });
  db.brands().forEach(function(b){ if(hit(b.name)) res.brands.push(b); });
  Object.keys(USAGES).forEach(function(k){
    if(db.byUsage(k).length && hit(USAGES[k].label+" "+USAGES[k].full)) res.usages.push(k);
  });
  return res;
}

/* ============================================================
   7) الموجّه (Router) بالـhash — قابل للمشاركة وزر الرجوع يعمل
   ============================================================ */
var Router = {
  current:{name:"home",params:{}},
  parse:function(){
    var raw=(location.hash||"").replace(/^#\/?/,"");
    var parts=raw.split("/").filter(Boolean).map(function(x){try{return decodeURIComponent(x);}catch(e){return x;}});
    var k=parts[0];
    if(k==="c")     return parts.length>=3 ? {name:"sub",params:{cat:parts[1],sub:parts[2]}} : {name:"category",params:{cat:parts[1]}};
    if(k==="u")     return {name:"use",params:{tag:parts[1]}};
    if(k==="b")     return {name:"brand",params:{name:parts.slice(1).join("/")}};
    if(k==="p")     return {name:"product",params:{id:parts[1]}};
    if(k==="q")     return {name:"search",params:{q:parts.slice(1).join("/")}};
    if(k==="fav")   return {name:"favorites",params:{}};
    if(k==="admin") return {name:"admin",params:{}};
    return {name:"home",params:{}};
  },
  go:function(hash){ if(location.hash===hash) this.handle(); else location.hash=hash; },
  handle:function(){ this.current=this.parse(); App.render(this.current); },
  start:function(){ var self=this; window.addEventListener("hashchange",function(){self.handle();}); this.handle(); }
};
function href(name,a){
  a=a||{};
  if(name==="home") return "#/";
  if(name==="category") return "#/c/"+encodeURIComponent(a.cat);
  if(name==="sub") return "#/c/"+encodeURIComponent(a.cat)+"/"+encodeURIComponent(a.sub);
  if(name==="use") return "#/u/"+encodeURIComponent(a.tag);
  if(name==="brand") return "#/b/"+encodeURIComponent(a.name);
  if(name==="product") return "#/p/"+encodeURIComponent(a.id);
  if(name==="search") return "#/q/"+encodeURIComponent(a.q||"");
  if(name==="favorites") return "#/fav";
  if(name==="admin") return "#/admin";
  return "#/";
}

function productRail(list){ return '<div class="prail">'+list.map(productCard).join("")+'</div>'; }
function skeletonGrid(n){

   9) التطبيق: التركيب + المشاهد

var App = {
  app:null,
  render:function(route){
    this.app=this.app||$("#app");
    document.body.setAttribute("data-route", route.name);
    syncShopUI(); syncFavCount(); syncNav(route);
    closeSuggest(); closeMenu();
    window.scrollTo({top:0,behavior:"auto"});
    try{
      switch(route.name){
        case "home":      return this.mount(viewHome, false);
        case "category":  return this.mount(function(){return viewCategory(route.params.cat);}, true);
        case "sub":       return this.mount(function(){return viewSub(route.params.cat,route.params.sub);}, true);
        case "use":       return this.mount(function(){return viewUse(route.params.tag);}, true);
        case "brand":     return this.mount(function(){return viewBrand(route.params.name);}, true);
        case "product":   return this.mount(function(){return viewProduct(route.params.id);}, false);
        case "search":    return this.mount(function(){return viewSearch(route.params.q);}, false);
        case "favorites": return this.mount(viewFavorites, true);
        case "admin":     return this.mount(Admin.view, false);
        default:          return this.mount(viewHome,false);
      }
    }catch(e){
      this.app.innerHTML='<div class="wrap"><div class="view">'+emptyState({icon:"alert",title:"صار خطأ غير متوقّع",
        text:"تعذّر عرض هذه الصفحة. جرّب الرجوع للرئيسية.",
        sug:'<a class="btn btn--primary btn--sm" href="#/">الرئيسية</a>'})+'</div></div>';
      if(window.console) console.error(e);
    }
  },
  /* mount: يعرض هيكلاً عظمياً للمشاهد ذات الصور ثم المحتوى في الإطار التالي (إحساس تحميل حقيقي) */
  mount:function(builder, useSkeleton){
    var self=this;
    if(useSkeleton){
      self.app.innerHTML='<div class="wrap"><div class="view">'+skeletonGrid(8)+'</div></div>';
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        self.app.innerHTML=builder(); paintIcons(self.app);
      });});
    }else{
      self.app.innerHTML=builder(); paintIcons(self.app);
    }
  }
};

/* ---------- مشهد القسم ---------- */
function viewCategory(catId){
  var cat=db.category(catId);
  if(!cat) return notFound("القسم غير موجود");
  var h='<div class="wrap view">'+crumbs([["الرئيسية","#/"],[cat.name,null]]);
  if(db.hasSubs(cat)){
    /* بوابات فرعية */
    var subs=cat.subs||[]; var all=db.byCategory(cat.id);
    h+=sectionHead(cat.name, cat.desc||"اختر التصنيف الفرعي");
    h+='<div class="cats">'
      + '<a class="cat" style="--ga:var(--sky)" href="'+href("category",{cat:cat.id})+'#all">'
      +   '<span class="cat__ic">'+emb(cat.emblem)+'</span><span class="cat__t"><b>كل المنتجات</b><span class="tnum">'+all.length+' منتج</span></span></a>'
      + subs.map(function(sb){var n=db.bySub(cat.id,sb.id).length;
          return '<a class="cat" style="--ga:var(--sky)" href="'+href("sub",{cat:cat.id,sub:sb.id})+'">'
            + '<span class="cat__ic">'+emb(sb.emblem||cat.emblem)+'</span>'
            + '<span class="cat__t"><b>'+esc(sb.name)+'</b><span class="tnum">'+n+' منتج</span></span></a>';
        }).join("")
      + '</div>';
    /* وكذلك كل المنتجات أسفل البوابات */
    h+=sectionHead("كل منتجات "+cat.name,null);
    h+= all.length ? '<div class="pgrid">'+all.map(productCard).join("")+'</div>'
                   : emptyState({title:"ما في منتجات بهذا القسم بعد"});
  }else{
    var list=db.byCategory(cat.id);
    h+=sectionHead(cat.name, cat.desc||null);
    h+= list.length ? '<div class="pgrid">'+list.map(productCard).join("")+'</div>'
                    : emptyState({title:"ما في منتجات بهذا القسم بعد",sug:'<a class="btn btn--primary btn--sm" href="#/">الرجوع للرئيسية</a>'});
  }
  return h+'</div>';
}

function viewSub(catId,subId){
  var cat=db.category(catId);
  if(!cat) return notFound("القسم غير موجود");
  var subs=cat.subs||[];
  var list = subId==="__all__" ? db.byCategory(cat.id) : db.bySub(cat.id,subId);

    + '<a class="chip" href="'+href("sub",{cat:cat.id,sub:"__all__"})+'" aria-pressed="'+(subId==="__all__")+'">الكل <span class="c tnum">('+db.byCategory(cat.id).length+')</span></a>'
    + subs.map(function(sb){var n=db.bySub(cat.id,sb.id).length;
        return '<a class="chip" href="'+href("sub",{cat:cat.id,sub:sb.id})+'" aria-pressed="'+(subId===sb.id)+'">'+esc(sb.name)+' <span class="c tnum">('+n+')</span></a>';

/* ---------- مشهد المنتج (Product Detail) ---------- */
function viewProduct(id){
  var p=db.product(id);
  if(!p) return notFound("المنتج غير موجود");
  var cat=db.category(p.sectionId)||{};
  var sub=db.subName(cat,p.subId);
  var fav=db.isFav(p.id);
  /* مشابهة: نفس الاستخدام، ثم نفس القسم */
  var similar={}; (p.usage||[]).forEach(function(t){db.byUsage(t).forEach(function(x){if(x.id!==p.id)similar[x.id]=x;});});
  var simList=Object.keys(similar).map(function(k){return similar[k];});
  if(simList.length<3){ db.byCategory(p.sectionId).forEach(function(x){if(x.id!==p.id && !similar[x.id])simList.push(x);}); }
  simList=simList.slice(0,6);
  var sameBrand = (p.company&&p.company!=="—") ? db.byBrand(p.company).filter(function(x){return x.id!==p.id;}).slice(0,6) : [];

  var specs='';
  if(p.company&&p.company!=="—") specs+=spec("الشركة",p.company);
  if(p.origin&&p.origin!=="—")   specs+=spec("المنشأ",p.origin);
  if(p.size)  specs+=spec("الحجم/المواصفات",p.size);
  if(cat.name)specs+=spec("القسم",cat.name+(sub&&sub!=="عام"?" › "+sub:""));

  var h='<div class="wrap view">'+crumbs([["الرئيسية","#/"],[cat.name||"",cat.id?href("category",{cat:cat.id}):null],[p.name,null]]);
  h+='<a class="backbtn" href="'+(cat.id?href("category",{cat:cat.id}):"#/")+'">'+I.back+' رجوع</a>';
  h+='<article class="pd">'
    + '<div class="pd__media">'+ (p.image?'<img src="'+attr(p.image)+'" alt="'+attr(p.name)+'" decoding="async">':'<span class="pd__ph">'+emb(cat.emblem||"box")+'</span>') +'</div>'
    + '<div class="pd__info">'
    +   '<div class="pd__head"><h1 class="pd__title">'+esc(p.name)+'</h1>'
    +     '<button class="pd__fav" data-fav="'+attr(p.id)+'" aria-pressed="'+fav+'" aria-label="'+(fav?'إزالة من المفضّلة':'أضف للمفضّلة')+'">'+(fav?I.heartFill:I.heart)+'</button></div>'
    +   '<div class="pd__meta">'
    +     (p.available?'<span class="pill pill--ok">'+I.check+' متوفّر</span>':'<span class="pill pill--off">'+I.x+' غير متوفّر</span>')
    +     (cat.name?'<a class="pill" href="'+href("category",{cat:cat.id})+'">'+emb(cat.emblem)+' '+esc(cat.name)+'</a>':'')
    +     (p.usage||[]).slice(0,3).map(function(t){return USAGES[t]?'<a class="pill" href="'+href("use",{tag:t})+'">'+esc(USAGES[t].label)+'</a>':'';}).join('')
    +   '</div>'
    +   (p.use?'<p class="pd__desc"><b>الاستعمال:</b> '+esc(p.use)+'</p>':'')
    +   (p.desc?'<p class="pd__desc">'+esc(p.desc)+'</p>':'')
    +   (specs?'<div class="pd__specs">'+specs+'</div>':'')
    +   '<div class="pd__actions">'
    +     (db.shop().phone?'<a class="btn btn--primary" href="'+telHref(db.shop().phone)+'">'+I.phone+' اتصل للطلب</a>':'')
    +     (waHref(db.shop().phone)?'<a class="btn btn--outline" href="'+waHref(db.shop().phone)+'" target="_blank" rel="noopener">'+I.whatsapp+' واتساب</a>':'')
    +   '</div>'
    +   '<p class="footer__note" style="color:var(--muted)">* الأسعار والطلب عبر التواصل المباشر مع المحل.</p>'
    + '</div>'
    + '</article>';
  if(simList.length){ h+=sectionHead("منتجات مشابهة",null); h+=productRail(simList); }
  if(sameBrand.length){ h+=sectionHead("من نفس الشركة",null); h+=productRail(sameBrand); }
  return h+'</div>';
}
function spec(k,v){ return '<div class="pd__spec"><b>'+esc(k)+'</b><span>'+esc(v)+'</span></div>'; }

/* ---------- مشهد البحث ---------- */
function viewSearch(q){
  q=q||"";
  var r=searchAll(q);
  var total=r.products.length+r.categories.length+r.brands.length+r.usages.length;
  var h='<div class="wrap view">';
  h+='<div class="shead"><div class="shead__t"><h2>نتائج البحث</h2>'
    + '<span class="shead__sub">عن «'+esc(q)+'» — '+total+' نتيجة</span></div></div>';
  if(!total){

var activeSuggest=null;
function buildSuggest(q){
  var r=searchAll(q);
  var box='';
  if(r.products.length){
    box+='<div class="suggest__group"><div class="suggest__label">منتجات</div>'
      + r.products.slice(0,6).map(function(p){var cat=db.category(p.sectionId)||{};
          return '<a class="suggest__item" href="'+href("product",{id:p.id})+'" data-sgo>'
            + '<span class="suggest__thumb">'+(p.image?'<img src="'+attr(p.image)+'" alt="">':emb(cat.emblem||"box"))+'</span>'
            + '<span class="suggest__txt"><b>'+esc(p.name)+'</b><span>'+esc(cat.name||"")+(p.available?"":" · غير متوفّر")+'</span></span></a>';
        }).join("")+'</div>';
  }
  if(r.categories.length){
    box+='<div class="suggest__group"><div class="suggest__label">أقسام</div>'
      + r.categories.map(function(c){return '<a class="suggest__item" href="'+href("category",{cat:c.id})+'" data-sgo>'
          + '<span class="suggest__thumb">'+emb(c.emblem)+'</span><span class="suggest__txt"><b>'+esc(c.name)+'</b><span>قسم</span></span></a>';}).join("")+'</div>';
  }
  if(r.usages.length){
    box+='<div class="suggest__group"><div class="suggest__label">حسب الاستخدام</div>'
      + r.usages.map(function(k){return '<a class="suggest__item" href="'+href("use",{tag:k})+'" data-sgo>'
          + '<span class="suggest__thumb">'+emb(USAGES[k].icon)+'</span><span class="suggest__txt"><b>'+esc(USAGES[k].label)+'</b><span>'+db.byUsage(k).length+' منتج</span></span></a>';}).join("")+'</div>';
  }
  if(r.brands.length){
    box+='<div class="suggest__group"><div class="suggest__label">شركات</div>'
      + r.brands.map(function(b){return '<a class="suggest__item" href="'+href("brand",{name:b.name})+'" data-sgo>'
          + '<span class="suggest__thumb">'+I.building+'</span><span class="suggest__txt"><b>'+esc(b.name)+'</b><span>'+b.count+' منتج</span></span></a>';}).join("")+'</div>';
  }
  if(!box) box='<div class="suggest__empty">ما في نتائج… اضغط Enter للبحث الكامل</div>';
  return '<div class="suggest" role="listbox">'+box+'</div>';
}
function openSuggest(anchorForm,q){
  closeSuggest();
  if(!q||!q.trim()) return;
  var wrap=anchorForm.closest(".hsearch")||anchorForm.closest(".msearch")||anchorForm.parentNode;
  var el=document.createElement("div"); el.innerHTML=buildSuggest(q);
  var node=el.firstChild; wrap.appendChild(node); paintIcons(node); activeSuggest=node;
}
function closeSuggest(){ if(activeSuggest&&activeSuggest.parentNode){activeSuggest.parentNode.removeChild(activeSuggest);} activeSuggest=null; }

/* تصغير الصور قبل الحفظ (يبقى مؤقتاً؛ خلف طبقة يسهل تبديلها) */
function resizeImage(file,maxDim,quality){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){var img=new Image();
      img.onload=function(){var w=img.width,h=img.height,sc=Math.min(1,maxDim/Math.max(w,h));
        w=Math.round(w*sc);h=Math.round(h*sc);var c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);var out;
        try{out=c.toDataURL("image/webp",quality);if(out.indexOf("image/webp")<0)out=c.toDataURL("image/jpeg",quality);}catch(e){out=c.toDataURL("image/jpeg",quality);}
        res(out);};
      img.onerror=rej;img.src=fr.result;};
    fr.onerror=rej;fr.readAsDataURL(file);});
}

var toastT;
function toast(msg){
  var t=$("#toast"); if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t);}
  t.innerHTML=I.check+'<span>'+esc(msg)+'</span>';
  t.style.display="flex"; clearTimeout(toastT); toastT=setTimeout(function(){t.style.display="none";},2600);
}

/* ============================================================
   17) النشر: توليد HTML مستقل بالبيانات الحالية
   ============================================================ */
function exportPublishable(){
  var clone=document.documentElement.cloneNode(true);
  var appEl=clone.querySelector("#app"); if(appEl) appEl.innerHTML="";
  ["#toast","#modal","#menu"].forEach(function(sel){var e=clone.querySelector(sel);if(e&&sel!=="#menu")e.remove();});
  var mnu=clone.querySelector("#menu"); if(mnu) mnu.hidden=true;
  var seed=clone.querySelector("#seed-data"); if(seed) seed.textContent=JSON.stringify(db._d);
  var html="<!doctype html>\n"+clone.outerHTML;
  download(html,"home-needs.html","text/html;charset=utf-8");
  toast("تم تنزيل النسخة الجاهزة");
}
function download(content,fname,type){
  var blob=new Blob([content],{type:type||"text/plain"});var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},100);
}

/* ============================================================
   18) الأحداث (Event delegation)
   ============================================================ */
/* المفضّلة (تحديث موضعي بلا إعادة بناء) */
document.addEventListener("click",function(e){
  var fav=e.target.closest("[data-fav]");
  if(fav){ e.preventDefault(); e.stopPropagation();
    var id=fav.getAttribute("data-fav"); var on=db.toggleFav(id);
    $$('[data-fav="'+cssq(id)+'"]').forEach(function(b){ b.setAttribute("aria-pressed",on); b.innerHTML=on?I.heartFill:I.heart;
      b.setAttribute("aria-label",on?"إزالة من المفضّلة":"أضف للمفضّلة"); });
    syncFavCount(); toast(on?"أُضيف للمفضّلة":"أُزيل من المفضّلة"); return;
  }
  /* روابط اقتراحات: أغلق اللوحة */
  if(e.target.closest("[data-sgo]")){ closeSuggest(); clearHeaderSearch(); return; }

  /* أزرار عامة عبر data-act */
  var act=e.target.closest("[data-act]");
  if(act){
    var a=act.getAttribute("data-act");
    if(a==="menu"){ e.preventDefault(); toggleMenu(); return; }
    if(a==="lock"){ e.preventDefault(); Storage.setUnlocked(false); Router.go("#/"); return; }
  }
  /* إغلاق المودال */
  if(e.target.closest("[data-close]")||(e.target.classList&&e.target.classList.contains("modal-back"))){ closeModal(); return; }

  /* أدمن */
  var atab=e.target.closest("[data-atab]");
  if(atab){ Admin.tab=atab.getAttribute("data-atab"); Admin.filter=""; App.render(Router.current); return; }
  if(e.target.closest("[data-adminlock]")){ Storage.setUnlocked(false); Router.go("#/"); return; }
  if(e.target.closest("[data-padd]")){ openProductModal(null); return; }
  var pe=e.target.closest("[data-pedit]"); if(pe){ openProductModal(db.product(pe.getAttribute("data-pedit"))); return; }
  var pd=e.target.closest("[data-pdel]"); if(pd){ if(confirm("حذف هذا المنتج نهائياً؟")){ db.deleteProduct(pd.getAttribute("data-pdel")); Admin.refresh(); toast("تم الحذف"); } return; }
  if(e.target.closest("[data-shopsave]")){ saveShopForm(); return; }
  if(e.target.closest("[data-publish]")){ exportPublishable(); return; }
  if(e.target.closest("[data-export]")){ download(JSON.stringify(db._d,null,2),"home-needs-backup.json","application/json"); toast("تم التصدير"); return; }
  if(e.target.closest("[data-reset]")){ if(confirm("إعادة الضبط وحذف تعديلاتك بهذا المتصفح؟")){ db.resetToSeed(); App.render(Router.current); toast("تمت إعادة الضبط"); } return; }

  /* search clear (in-view forms) */
  var sc=e.target.closest("[data-searchclear]");
  if(sc){ var form=sc.closest(".search"); var inp=form&&form.querySelector("input"); if(inp){inp.value="";form.classList.remove("has-value");inp.focus();} closeSuggest(); return; }

  /* إغلاق الاقتراحات عند النقر خارجها */
  if(!e.target.closest(".hsearch")&&!e.target.closest(".msearch")&&!e.target.closest(".hero__search")) closeSuggest();
  if(!e.target.closest("#menu")&&!e.target.closest("[data-act='menu']")) closeMenu();
});

/* إدخال البحث الحيّ (كل الحقول التي تحمل input[name=q] أو داخل .search بالهيدر/الهيرو) */
var onType=debounce(function(input){
  var q=input.value; var form=input.closest(".search");
  if(form){ form.classList.toggle("has-value",!!q.trim()); }
  if(!q.trim()){ closeSuggest(); return; }
  openSuggest(form||input, q);
},130);
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.matches('.hsearch input, .msearch input, .hero__search input')){ onType(t); return; }
  if(t.matches("[data-pfilter]")){ Admin.filter=t.value; var b=$("#adminbody"); if(b){b.innerHTML=Admin.products();paintIcons(b);} return; }
});
/* Enter في أي حقل بحث → صفحة البحث */
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    var t=e.target;
    if(t.matches&&t.matches('.hsearch input, .msearch input, .hero__search input')){
      e.preventDefault(); var q=t.value.trim(); closeSuggest();
      if(q){ Router.go(href("search",{q:q})); }
      t.blur(); return;
    }
    if(t.id==="pin"){ Admin.tryPin(); }
  }
  if(e.key==="Escape"){ closeSuggest(); closeMenu(); closeModal(); }
  /* اختصار / للبحث */
  if((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="K")){ var s=$('.hsearch input')||$('.msearch input'); if(s){e.preventDefault();s.focus();} }
});
document.addEventListener("submit",function(e){
  if(e.target.matches("[data-searchform]")||e.target.classList.contains("search")){
    e.preventDefault(); var inp=e.target.querySelector("input"); var q=inp&&inp.value.trim();
    closeSuggest(); if(q) Router.go(href("search",{q:q}));
  }
});
/* pin */
document.addEventListener("click",function(e){ if(e.target.closest("#pingo")) Admin.tryPin(); });
Admin.tryPin=function(){
  var v=($("#pin")||{}).value||""; var ok=(db.shop().adminPin||"1234");
  if(v===ok){ Storage.setUnlocked(true); App.render(Router.current); }
  else{ var er=$("#pinerr"); if(er)er.textContent="رمز غير صحيح"; }
};
function saveShopForm(){
  var patch={social:Object.assign({},db.shop().social||{})};
  $$("[data-shopin]").forEach(function(i){var k=i.getAttribute("data-shopin");
    if(k==="ig") patch.social.instagram=i.value.trim(); else patch[k]=i.value.trim();});
  db.setShop(patch); syncShopUI(); toast("تم حفظ معلومات المحل");
}
/* استيراد JSON */
document.addEventListener("change",function(e){
  if(e.target&&e.target.id==="importjson"){ var f=e.target.files[0]; if(!f)return;
    var fr=new FileReader(); fr.onload=function(){ try{var obj=JSON.parse(fr.result);
      if(!obj.products||!obj.sections){toast("ملف غير صالح");return;} db._d=migrate(obj); db.save(); App.render(Router.current); toast("تم الاستيراد"); }
      catch(err){toast("تعذّر قراءة الملف");} }; fr.readAsText(f);
  }
});
function clearHeaderSearch(){ $$('.hsearch input, .msearch input').forEach(function(i){i.value="";var f=i.closest(".search");if(f)f.classList.remove("has-value");}); }
function cssq(s){ return String(s).replace(/["\\]/g,"\\$&"); }

/* ============================================================
   19) الإقلاع
   ============================================================ */
db.init();
if(db.error && window.console) console.warn("data init issue, seeded fresh:",db.error);
paintIcons(document);
Router.start();

})();
